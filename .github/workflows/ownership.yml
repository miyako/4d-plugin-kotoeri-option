name: Native ownership

on:
  push:
    branches: [master, miyako-kotoeri-ownership-audit]
  pull_request:

permissions:
  contents: read

jobs:
  ownership:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synthetic native ownership differential
        run: python3 .github/tests/test_ownership.py --baseline --output "$RUNNER_TEMP/kotoeri-ownership"
      - name: Source lifecycle regression
        run: python3 -m unittest discover -s .github/tests -p test_lifecycle.py
